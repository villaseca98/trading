<title>Loco Capital Trading Floor</title>
<meta name="description" content="Oficina simulada de bots de trading con roles: traders, incubadora, minería, riesgos, macro, coberturas, comité y kill switch.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabecera de cifras arriba, panel de mando a la izquierda, oficina isométrica a la derecha, botonera abajo. Un solo tema oscuro, como un parqué de trading. */
:root {
  --bg: #0b0d0a;
  --panel: #131611;
  --panel-2: #1a1e17;
  --line: #2b3127;
  --fg: #eef2e4;
  --muted: #8d9583;
  --acc: #dcf53b;
  --acc-ink: #11140b;
  --neg: #ff5c4d;
  --floor: #e7e9e1;
  --floor-line: #d5d9cc;
  --floor-dark: #1d211a;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-inline: 16px; padding-block: 10px; gap: 10px; }

/* cabecera */
.top { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; min-width: 0; }
.marca { display: flex; flex-direction: column; justify-content: center; padding-right: 8px; }
.marca b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: .95; letter-spacing: .5px; }
.marca span { font-family: var(--display); color: var(--acc); font-size: 17px; letter-spacing: 1.5px; }
.kpis { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px 8px; min-width: 120px; }
.kpi.hl { border-color: color-mix(in srgb, var(--acc) 70%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 25%, transparent); }
.kpi.malo { border-color: color-mix(in srgb, var(--neg) 70%, transparent); }
.kpi small { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
.kpi strong { font-family: var(--body); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.05; white-space: nowrap; }
.kpi em { font-style: normal; font-size: 13px; font-weight: 700; margin-left: 6px; font-variant-numeric: tabular-nums; }
.pos { color: var(--acc); } .neg { color: var(--neg); }
.estado { align-self: center; font-weight: 800; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--acc); color: var(--acc-ink); white-space: nowrap; }
.estado.kill { background: var(--neg); color: #fff; }
.estado.pausa { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); }

/* cuerpo */
.main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 10px; min-height: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--acc); color: var(--acc-ink); }
.tabs button:focus-visible, .tb button:focus-visible, .fila:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.cuerpo { overflow: auto; padding: 10px 12px 14px; min-height: 0; }
.nota { color: var(--muted); font-size: 13.5px; line-height: 1.4; margin: 0 0 10px; }
.nota b { color: var(--fg); }
table.g { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; margin-bottom: 14px; }
table.g th { text-align: right; color: var(--muted); font-weight: 700; font-size: 11px; letter-spacing: .8px; text-transform: uppercase; padding: 4px 3px; }
table.g td { text-align: right; padding: 5px 3px; border-top: 1px solid var(--line); font-weight: 700; white-space: nowrap; }
table.g th:first-child, table.g td:first-child { text-align: left; white-space: normal; }
.sec { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 0 6px; }
.sec h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 16px; letter-spacing: 1px; color: var(--acc); }
.sec span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.fila { display: grid; grid-template-columns: 1fr 64px 86px; align-items: center; gap: 8px; padding: 6px 4px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
.fila:hover { background: var(--panel-2); }
.fila .q { min-width: 0; }
.fila .q b { display: block; font-size: 15px; }
.fila .q code { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fila svg { width: 64px; height: 22px; }
.fila .r { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.fila .r small { display: block; color: var(--muted); font-weight: 600; font-size: 12px; }
.dept { border-top: 1px solid var(--line); padding: 9px 0; }
.dept h4 { margin: 0 0 3px; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.dept h4 span { color: var(--acc); font-variant-numeric: tabular-nums; }
.dept p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
.log { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.log li { border-top: 1px solid var(--line); padding: 5px 0; line-height: 1.35; }
.log li time { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-right: 6px; }
.log li b { color: var(--acc); }
.log li.kill b, .log li.perdida b, .log li.stop b { color: var(--neg); }
.ctl { display: grid; gap: 12px; }
.ctl label { display: grid; gap: 3px; font-size: 14px; font-weight: 600; }
.ctl label span { display: flex; justify-content: space-between; }
.ctl label span output { color: var(--acc); font-variant-numeric: tabular-nums; }
.ctl input[type=range] { width: 100%; accent-color: var(--acc); }
.ctl small { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
.btn.prim { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }

/* oficina */
.ofi { position: relative; border-radius: 14px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); min-height: 0; touch-action: none; }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
canvas#c.drag { cursor: grabbing; }
.ficha { position: absolute; right: 12px; top: 12px; width: min(330px, calc(100% - 24px)); background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; max-height: calc(100% - 24px); overflow: auto; }
.ficha h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: .5px; }
.ficha .rol { color: var(--acc); font-weight: 700; margin: 0 0 6px; }
.ficha p { margin: 0 0 8px; color: var(--muted); line-height: 1.4; }
.ficha dl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 8px 0; }
.ficha dt { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
.ficha dd { margin: 0; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.ficha code { font-family: var(--mono); font-size: 12px; }
.ficha .x { position: absolute; top: 8px; right: 10px; background: none; border: 0; font-size: 20px; cursor: pointer; color: var(--muted); }
.fuente { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--bg) 80%, transparent); padding: 4px 8px; border-radius: 8px; pointer-events: none; }

/* botonera */
.tb { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tb button { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
.tb button:hover { border-color: var(--muted); }
.tb button.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.tb button.kill { border-color: var(--neg); color: #ffb3ab; background: color-mix(in srgb, var(--neg) 18%, var(--panel)); }
.tb .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
.tb .vel { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tb .vel button { border: 0; border-radius: 0; padding: 7px 9px; }
.megafono { display: flex; gap: 6px; }
.megafono input { background: var(--panel); border: 1px solid var(--acc); color: var(--fg); border-radius: 10px; padding: 7px 10px; font: inherit; width: 240px; max-width: 60vw; }
.ayuda { position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); display: grid; place-items: center; padding: 16px; z-index: 5; }
.ayuda > div { max-width: 620px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px; max-height: 100%; overflow: auto; line-height: 1.45; }
.ayuda h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0 0 8px; letter-spacing: .5px; }
.ayuda p, .ayuda li { color: #c9cfbd; font-size: 15px; }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .ofi { height: 62vh; order: -1; }
  .panel { max-height: none; }
  .kpis { flex-basis: 100%; }
  .kpi { min-width: 0; flex: 1 1 40%; }
  .kpi strong { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script>
(function () {
'use strict';
const O = window.Oficina;
const $ = id => document.getElementById(id);
const fmt = O.fmt, pct = O.pct;

// ───────────── fondo ─────────────
let fondo, semilla = 7;
function nuevoFondo(aj) {
  const datos = window.DATOS_REALES;
  if (datos) {
    const n = datos.fechas.length, desde = datos.fechas[Math.max(300, n - 520)];
    fondo = new O.Fondo({ datos, desde, semilla, ajustes: aj });
  } else fondo = new O.Fondo({ semilla, hoy: '2026-10-06', ajustes: aj });
  $('fuente').textContent = (datos ? `Datos reales hasta ${datos.fechas[datos.fechas.length - 1]} · dinero simulado` : 'Mercado simulado · dinero simulado') + (window.ESTADO_REAL ? ' · pestaña Real: tu fondo real' : '');
}
nuevoFondo();

// ───────────── plano de la oficina (en baldosas) ─────────────
const SALAS = [
  { id: 'trading', nombre: 'SALA DE TRADING', x: 0, y: 0, w: 24, h: 18 },
  { id: 'riesgos', nombre: 'RIESGOS', x: 24, y: 0, w: 10, h: 9 },
  { id: 'macro', nombre: 'MACROECONOMÍA', x: 24, y: 9, w: 10, h: 9 },
  { id: 'arbitraje', nombre: 'ARBITRAJE', x: 0, y: 18, w: 9, h: 9 },
  { id: 'coberturas', nombre: 'COBERTURAS', x: 9, y: 18, w: 8, h: 9 },
  { id: 'comite', nombre: 'SALA DE COMITÉ', x: 17, y: 18, w: 9, h: 9, oscura: true },
  { id: 'kill', nombre: 'KILL SWITCH', x: 26, y: 18, w: 8, h: 9, oscura: true },
  { id: 'minadas', nombre: 'ESTRATEGIAS MINADAS', x: 0, y: 27, w: 12, h: 10 },
  { id: 'mineria', nombre: 'MINERÍA', x: 12, y: 27, w: 9, h: 10, oscura: true },
  { id: 'quant', nombre: 'EQUIPO QUANT', x: 21, y: 27, w: 13, h: 5 },
  { id: 'juegos', nombre: 'SALA DE JUEGOS', x: 21, y: 32, w: 13, h: 5, oscura: true },
  { id: 'pruebas', nombre: 'MESA DE PRUEBAS', x: 0, y: 37, w: 34, h: 12 },
];
const SALA = Object.fromEntries(SALAS.map(s => [s.id, s]));
function rejilla(sala, dx, dy, mx = 1.2, my = 1.4, abajo = 0) {
  const s = SALA[sala], out = [];
  for (let y = s.y + my; y + 2 <= s.y + s.h - abajo; y += dy) for (let x = s.x + mx; x + 1.6 <= s.x + s.w; x += dx) out.push({ x, y, ocupa: null });
  return out;
}
const PUESTOS = {
  trading: rejilla('trading', 2.9, 2.8, 1.4, 1.6, 2.6),
  arbitraje: rejilla('arbitraje', 2.8, 2.5, 1.2, 1.2, 2),
  coberturas: [{ x: 11, y: 21, ocupa: null }, { x: 13.8, y: 21, ocupa: null }, { x: 11, y: 24, ocupa: null }],
  minadas: rejilla('minadas', 2.8, 2.6, 1.2, 1.2, 2.2),
  pruebas: rejilla('pruebas', 2.6, 2.6, 1, 1.2, 2.4),
};
const STAFF = [
  { k: 'riesgos', nombre: 'Marta', rol: 'Jefa de riesgos', sala: 'riesgos', x: 26, y: 2.5, desc: 'Ajusta el tamaño de cada posición a su volatilidad, limita la exposición bruta del fondo y ejecuta los stops por operación.' },
  { k: 'riesgos', nombre: 'Paco', rol: 'Vigilante de stops', sala: 'riesgos', x: 30, y: 5, desc: 'Vigila cada operación abierta y corta las que pierden más de lo permitido. Después, castigo de unas sesiones.' },
  { k: 'macro', nombre: 'Elena', rol: 'Economista jefe', sala: 'macro', x: 27, y: 12, desc: 'Clasifica el mercado (alcista, lateral, bajista, tranquilo o volátil) con la media de 200 sesiones y la volatilidad. Con régimen malo, el fondo arriesga menos.' },
  { k: 'comite', nombre: 'Carmen', rol: 'Presidenta del comité', sala: 'comite', x: 20, y: 21.2, desc: 'Cada mes: asciende a los mejores de la incubadora, degrada o despide a los que pierden, y reparte el capital según resultados.' },
  { k: 'comite', nombre: 'Luis', rol: 'Vocal del comité', sala: 'comite', x: 23, y: 21.2, desc: 'Vota en las reuniones mensuales del comité.' },
  { k: 'comite', nombre: 'Rosa', rol: 'Vocal del comité', sala: 'comite', x: 21.5, y: 24.6, desc: 'Vota en las reuniones mensuales del comité.' },
  { k: 'kill', nombre: 'Guardia', rol: 'Guardián del kill switch', sala: 'kill', x: 28, y: 21.5, desc: 'Si el fondo cae más del límite desde su máximo, cierra todas las posiciones y para la sala hasta que alguien pulse Reabrir.' },
  { k: 'mineria', nombre: 'Minero 1', rol: 'Minero de estrategias', sala: 'mineria', x: 14, y: 29.5, desc: 'Prueba combinaciones al azar de estrategias conocidas, activos y parámetros contra el histórico. Las que pasan el filtro van a la incubadora.' },
  { k: 'mineria', nombre: 'Minero 2', rol: 'Minero de estrategias', sala: 'mineria', x: 17, y: 29.5, desc: 'Prueba combinaciones al azar de estrategias conocidas, activos y parámetros contra el histórico.' },
  { k: 'mineria', nombre: 'Minero 3', rol: 'Minero de estrategias', sala: 'mineria', x: 15.5, y: 33, desc: 'Prueba combinaciones al azar de estrategias conocidas, activos y parámetros contra el histórico.' },
  { k: 'analista', nombre: 'Sofía', rol: 'Analista de informes', sala: 'quant', x: 23, y: 28.6, desc: 'Escribe el informe semanal del fondo: patrimonio, mejor y peor trader, régimen.' },
  { k: 'ejecucion', nombre: 'Andrés', rol: 'Ejecución e infraestructura', sala: 'quant', x: 27, y: 28.6, desc: 'Recibe las órdenes decididas al cierre y las ejecuta en la apertura siguiente con comisión y deslizamiento.' },
];
const JUEGOS = []; { const s = SALA.juegos; for (let i = 0; i < 160; i++) JUEGOS.push({ x: s.x + 0.8 + ((i * 2.3) % (s.w - 1.6)), y: s.y + 0.8 + ((i * 0.37) % (s.h - 1.6)) }); }
const CAMISAS = ['#3a4255', '#4a3a3a', '#2f4a42', '#54483a', '#3d3550', '#2d3f55', '#55303f', '#3a4a2a', '#5a5a5a', '#30484f'];
const PIELES = ['#f1c9a5', '#d9a77f', '#b97f55', '#8d5a3b', '#e8b996'];
const PELOS = ['#1d1612', '#3a2a1c', '#6b4a2a', '#c99a55', '#2a2a2a', '#7a2e1c'];

// ───────────── agentes ─────────────
const agentes = new Map(); // clave → agente
let descanso = false;
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); return (n ^ (n >>> 15)) >>> 0; }
function nuevoAgente(clave, x, y, semillaVisual) {
  const h = hash(semillaVisual);
  const a = { clave, x, y, tx: x, ty: y, camisa: CAMISAS[h % CAMISAS.length], piel: PIELES[(h >> 4) % PIELES.length], pelo: PELOS[(h >> 8) % PELOS.length], fase: (h % 100) / 16, sentado: false };
  agentes.set(clave, a); return a;
}
STAFF.forEach((s, i) => { const a = nuevoAgente('s' + i, s.x, s.y, 900 + i); a.staff = s; a.camisa = s.k === 'kill' ? '#6e1f1a' : s.k === 'comite' ? '#20231d' : a.camisa; });

function liberar(tr) { for (const sala in PUESTOS) for (const p of PUESTOS[sala]) if (p.ocupa === tr.id) p.ocupa = null; }
function puestoDe(tr, sala) {
  const lista = PUESTOS[sala]; if (!lista) return null;
  let p = lista.find(p => p.ocupa === tr.id); if (p) return p;
  p = lista.find(p => !p.ocupa); if (p) { liberar(tr); p.ocupa = tr.id; }
  return p || null;
}
function sincronizar() {
  const vistos = new Set();
  for (const tr of fondo.traders) {
    const clave = 't' + tr.id;

const VELOCIDADES = [[0.5, '½×'], [1, '1×'], [3, '3×'], [10, '10×'], [30, '30×']];

let arr = null;
